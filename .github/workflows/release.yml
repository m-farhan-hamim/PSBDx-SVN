name: Release

# Push a tag equal to versionName (e.g. 1.1.1). F-Droid's `Binaries:` URL expects
# .../releases/download/<versionName>/app-release.apk
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set: refusing to publish a debug-signed release"; exit 1; }
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-build-cache assembleRelease bundleRelease

      - name: Verify it is not debug-signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "debug-signed APK, aborting"; exit 1; fi

      - name: Publish GitHub release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/
          cp app/build/outputs/bundle/release/app-release.aab dist/
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/app-release.apk dist/app-release.aab --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/app-release.apk dist/app-release.aab \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
