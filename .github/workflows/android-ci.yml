name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every secret is optional. Missing values (forks, PRs) become empty strings and
    # app/build.gradle.kts falls back to debug signing / a disabled Google Drive UI.
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK, release AAB and dev APK
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease assembleDev

      - name: Collect the three artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp app/build/outputs/apk/dev/app-dev.apk dist/app-dev.apk
          ls -l dist
          for f in app-release.apk app-release.aab app-dev.apk; do test -s "dist/$f" || { echo "missing $f"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: psbdx-svn-binaries
          path: |
            dist/app-release.apk
            dist/app-release.aab
            dist/app-dev.apk
          if-no-files-found: error
