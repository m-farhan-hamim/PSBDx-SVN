name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Signing secrets are optional. Missing values (forks, PRs) become empty strings and
    # app/build.gradle.kts falls back to debug signing. The Google client ID is a public value
    # committed in gradle.properties; no Google secret is injected, so builds stay reproducible.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK, release AAB and dev APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease assembleDev

      - name: Collect the three artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp app/build/outputs/apk/dev/app-dev.apk dist/app-dev.apk
          ls -l dist
          for f in app-release.apk app-release.aab app-dev.apk; do test -s "dist/$f" || { echo "missing $f"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: psbdx-svn-binaries
          path: |
            dist/app-release.apk
            dist/app-release.aab
            dist/app-dev.apk
          if-no-files-found: error

  # F-Droid verifies that its own build equals the published APK. Approximate that here:
  # build twice from a clean tree in a different directory and time zone, then compare.
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build A
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-build-cache assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/a.apk"

      - name: Build B (other path, other time zone, clean tree)
        env:
          TZ: Asia/Dhaka
        run: |
          mkdir -p "$HOME/elsewhere/psbdx-copy"
          rsync -a --exclude .git --exclude build --exclude .gradle ./ "$HOME/elsewhere/psbdx-copy/"
          cd "$HOME/elsewhere/psbdx-copy"
          ./gradlew --no-daemon --no-build-cache assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/b.apk"

      - name: Compare (signature ignored)
        run: python3 scripts/compare_apks.py "$RUNNER_TEMP/a.apk" "$RUNNER_TEMP/b.apk"
