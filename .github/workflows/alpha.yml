name: Alpha

# Manual only. Builds the selected branch as ALPHA-<version>.<n> and publishes it straight away as a GitHub
# pre-release. <n> starts at 0 and goes up by one whenever that release tag already exists (a tag can only
# be used by one release). The prefix and number exist at build time only: the repository keeps the plain
# version. Release notes are generated by GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: ver
        run: |
          BASE=$(grep -m1 -oP '^\s*versionName = "\K[^"]+' app/build.gradle.kts | sed -E 's/^[A-Za-z]+-//; s/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          test -n "$BASE" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          NAMES=$(git ls-remote --tags origin "refs/tags/ALPHA-$BASE.*" | awk '{print $2}' | sed 's#refs/tags/##')
          N=0
          while printf '%s\n' "$NAMES" | grep -Fxq "ALPHA-$BASE.$N"; do N=$((N+1)); done
          echo "version=ALPHA-$BASE.$N" >> "$GITHUB_OUTPUT"
          echo "Building ALPHA-$BASE.$N"

      - name: Require release signing
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set, refusing to publish a debug-signed build"; exit 1; }

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK, release AAB and dev APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./gradlew --no-daemon --no-build-cache --stacktrace -PVERSION_NAME_OVERRIDE="$VERSION" assembleRelease bundleRelease assembleDev

      - name: Verify signature and version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "debug-signed APK, aborting"; exit 1; fi
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | tee badging.txt | head -1
          grep -q "versionName='$VERSION'" badging.txt || { echo "APK versionName is not $VERSION"; exit 1; }

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp app/build/outputs/apk/dev/app-dev.apk dist/app-dev.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: psbdx-svn-alpha-binaries
          path: dist/*
          if-no-files-found: error

      - name: Publish pre-release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$VERSION" dist/app-release.apk dist/app-release.aab dist/app-dev.apk \
            --title "$VERSION" --prerelease --target "$GITHUB_SHA" --generate-notes
