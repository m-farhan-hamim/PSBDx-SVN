name: Alpha

# Manual only. Builds the selected branch, prefixes the app version with ALPHA- (build time only: the
# repository keeps the plain version) and publishes the result straight away as a GitHub pre-release.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (optional, otherwise generated from the commits)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: alpha
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: ver
        run: |
          BASE=$(grep -m1 -oP '^\s*versionName = "\K[^"]+' app/build.gradle.kts | sed -E 's/^[A-Za-z]+-//')
          test -n "$BASE" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          echo "version=ALPHA-$BASE" >> "$GITHUB_OUTPUT"

      - name: Require release signing
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set, refusing to publish a debug-signed build"; exit 1; }

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK, release AAB and dev APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./gradlew --no-daemon --no-build-cache --stacktrace -PVERSION_NAME_OVERRIDE="$VERSION" assembleRelease bundleRelease assembleDev

      - name: Verify signature and version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "debug-signed APK, aborting"; exit 1; fi
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | tee badging.txt | head -1
          grep -q "versionName='$VERSION'" badging.txt || { echo "APK versionName is not $VERSION"; exit 1; }

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp app/build/outputs/apk/dev/app-dev.apk dist/app-dev.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: psbdx-svn-alpha-binaries
          path: dist/*
          if-no-files-found: error

      - name: Publish pre-release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          TAG="$VERSION-build${{ github.run_number }}"
          if [ -n "$NOTES" ]; then NOTE_ARGS=(--notes "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
          gh release create "$TAG" dist/app-release.apk dist/app-release.aab dist/app-dev.apk \
            --title "$VERSION (build ${{ github.run_number }})" --prerelease \
            --target "$GITHUB_SHA" "${NOTE_ARGS[@]}"
